async function accept(text){let o;try{o=JSON.parse(text)}catch(e){throw Error('二维码内容不是有效 JSON')}let changed=false;
 if(o.t==='meta'){
  const copy={t:o.t,v:o.v,f:o.f,n:o.n,s:o.s,ts:o.ts,k:o.k,b:o.b,l:o.l};
  if(crc(JSON.stringify(copy))!==o.h)throw Error('文件信息 CRC32 校验失败');

  if(metaChanged){if(meta&&meta.f!==o.f)packets.clear();meta=o;rebuildDecoder();changed=true;status('已收到文件信息：'+decodeName(o.n)+'，共 '+o.k+' 个源数据块')}

  const chosen=$('camera').value;
  let constraints=chosen?{audio:false,video:{deviceId:{exact:chosen}}}:{audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}};
  try{stream=await navigator.mediaDevices.getUserMedia(constraints)}catch(first){stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:'environment'}})}

  status(nativeQrDetector?'摄像头已启动，使用浏览器原生二维码识别。请将二维码放入绿色框。':'摄像头已启动，使用离线 jsQR 快速识别。请将二维码放入绿色框，尽量让二维码填满绿色框。');

let nativeQrDetector=null,scanFrameNo=0;
async function detectQrFrame(video){

 // 绿色框对应画面中央区域；优先裁剪中央 80%，让二维码在识别画面中占比更大。
 // 每第 6 帧扫描一次全画面，避免二维码未完全对准中央时漏识别。
 const full=(++scanFrameNo%6===0),vw=video.videoWidth,vh=video.videoHeight,ratio=full?1:0.80;
 const sw=Math.max(1,Math.round(vw*ratio)),sh=Math.max(1,Math.round(vh*ratio));
 const sx=Math.round((vw-sw)/2),sy=Math.round((vh-sh)/2);
 const scale=Math.min(1,560/Math.max(sw,sh));
 const w=Math.max(1,Math.round(sw*scale)),h=Math.max(1,Math.round(sh*scale));
 if(scanCanvas.width!==w||scanCanvas.height!==h){scanCanvas.width=w;scanCanvas.height=h}
 scanCtx.drawImage(video,sx,sy,sw,sh,0,0,w,h);
 const frame=scanCtx.getImageData(0,0,w,h);
 const result=window.jsQR(frame.data,w,h,{inversionAttempts:'dontInvert'});

}
async function scanLoop(){

  scanBusy=true;
  try{
   const t=await detectQrFrame(video);
   if(t&&t!==lastText){
    lastText=t;lastAt=Date.now();
    try{await accept(t)}catch(e){lastText='';status('识别到二维码，但数据无效：'+e.message)}
   }
  }catch(e){console.warn('QR scan error:',e)}
  finally{scanBusy=false}
 }

</script><script>const K=128,R=16,N=K+R,BLOCK=2000;
const gfExp=new Uint8Array(512),gfLog=new Uint8Array(256),gfMulTable=new Uint8Array(65536);
(()=>{let x=1;for(let i=0;i<255;i++){gfExp[i]=x;gfLog[x]=i;x<<=1;if(x&256)x^=0x11d;}for(let i=255;i<512;i++)gfExp[i]=gfExp[i-255];for(let a=0;a<256;a++)for(let b=0;b<256;b++)gfMulTable[(a<<8)|b]=(!a||!b)?0:gfExp[gfLog[a]+gfLog[b]]})();
function mul(a,b){return gfMulTable[(a<<8)|b]}
function inv(a){if(!a)throw Error('GF矩阵不可逆');return gfExp[255-gfLog[a]]}
function pow(a,n){if(n===0)return 1;if(a===0)return 0;return gfExp[(gfLog[a]*n)%255]}
function invertMatrix(input){let n=input.length,A=input.map((r,i)=>Uint8Array.from([...r,...Array.from({length:n},(_,j)=>i===j?1:0)]));for(let c=0;c<n;c++){let p=c;while(p<n&&!A[p][c])p++;if(p===n)throw Error('纠删码矩阵秩不足');if(p!==c)[A[p],A[c]]=[A[c],A[p]];let z=inv(A[c][c]);for(let j=0;j<2*n;j++)A[c][j]=mul(A[c][j],z);for(let i=0;i<n;i++)if(i!==c&&A[i][c]){z=A[i][c];for(let j=0;j<2*n;j++)A[i][j]^=mul(z,A[c][j]);}}return A.map(r=>r.slice(n))}
function generator(){let top=Array.from({length:K},(_,i)=>Uint8Array.from({length:K},(_,j)=>pow(i,j)));let ti=invertMatrix(top);let rows=[];for(let x=0;x<N;x++){let v=Uint8Array.from({length:K},(_,j)=>pow(x,j)),row=new Uint8Array(K);for(let j=0;j<K;j++)for(let q=0;q<K;q++)row[j]^=mul(v[q],ti[q][j]);rows.push(row)}return rows}
const GEN=generator();
function crc32(a){let c=0xffffffff;for(let i=0;i<a.length;i++){c^=a[i];for(let j=0;j<8;j++)c=(c>>>1)^((c&1)?0xedb88320:0)}return (c^0xffffffff)>>>0}
function toB64(a){let s='';const step=0x8000;for(let i=0;i<a.length;i+=step)s+=String.fromCharCode(...a.subarray(i,Math.min(i+step,a.length)));return btoa(s)}
function fromB64(s){let b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function makeParity(groupData,parityIndex){let row=GEN[K+parityIndex],out=new Uint8Array(BLOCK);for(let j=0;j<K;j++){let c=row[j];if(!c)continue;let block=groupData[j];for(let b=0;b<BLOCK;b++)out[b]^=mul(c,block[b])}return out}

const $=id=>document.getElementById(id);let stream=null,scanTimer=null,scanBusy=false,meta=null,groups=[],frameCount=0,blobUrl=null,finalBlob=null,finishing=false,lastText='',lastTime=0,canvas=document.createElement('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});
function setStatus(s){$('status').textContent=s}function fmt(n){return n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(2)+' MB'}
async function start(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});$('video').srcObject=stream;await $('video').play();$('cameraHint').classList.add('hidden');setStatus('摄像头已启动，请对准发送端二维码。');scanLoop()}catch(e){setStatus('无法启动摄像头：'+e.message+'。请使用 Safari，并允许摄像头权限。')}}
function stop(){if(scanTimer)clearTimeout(scanTimer);scanTimer=null;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('video').srcObject=null;$('cameraHint').classList.remove('hidden')}
function scanLoop(){if(!stream)return;scanTimer=setTimeout(async()=>{if(scanBusy){scanLoop();return}let v=$('video');if(v.readyState>=2){scanBusy=true;try{let w=v.videoWidth,h=v.videoHeight,scale=Math.min(1,900/Math.max(w,h));canvas.width=Math.round(w*scale);canvas.height=Math.round(h*scale);ctx.drawImage(v,0,0,canvas.width,canvas.height);let im=ctx.getImageData(0,0,canvas.width,canvas.height),code=jsQR(im.data,im.width,im.height,{inversionAttempts:'dontInvert'});if(code&&code.data){let now=Date.now();if(code.data!==lastText||now-lastTime>900){lastText=code.data;lastTime=now;await accept(code.data)}}}catch(e){console.warn(e)}finally{scanBusy=false}}scanLoop()},70)}
function update(){if(!meta)return;let done=groups.filter(g=>g&&g.done).length,total=meta.groups,got=groups.reduce((s,g)=>s+(g?g.received:0),0);$('groupsDone').textContent=done+'/'+total;$('blocksDone').textContent=groups.reduce((s,g)=>s+(g?g.recovered:0),0);$('frames').textContent=frameCount;$('bar').style.width=(done/total*100)+'%';$('fileInfo').innerHTML=`<b>文件：</b>${escapeHtml(meta.name)}<br><b>大小：</b>${fmt(meta.size)}<br><b>分组：</b>${total}<br><b>编码：</b>RS(${K+R},${K})，每组 ${K} 原始块 + ${R} 冗余块<br><b>已接收有效帧：</b>${frameCount}`;if(done===total)finish()}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function newGroup(){return {data:Array(K).fill(null),parity:new Map(),received:0,recovered:0,done:false}}
function recoverGroup(g){let missing=[];for(let i=0;i<K;i++)if(!g.data[i])missing.push(i);if(!missing.length){g.done=true;g.recovered=K;return true}if(g.parity.size<missing.length)return false;let chosen=[...g.parity.entries()].slice(0,missing.length),A=[],rhs=[];for(const [pi,payload] of chosen){let row=GEN[K+pi],coeff=Uint8Array.from(missing.map(i=>row[i])),res=payload.slice();for(let i=0;i<K;i++)if(g.data[i]){let c=row[i];if(!c)continue;let b=g.data[i];for(let z=0;z<BLOCK;z++)res[z]^=mul(c,b[z])}A.push(coeff);rhs.push(res)}let invA=invertMatrix(A);for(let m=0;m<missing.length;m++){let out=new Uint8Array(BLOCK);for(let q=0;q<missing.length;q++){let c=invA[m][q];if(!c)continue;for(let z=0;z<BLOCK;z++)out[z]^=mul(c,rhs[q][z])}g.data[missing[m]]=out}g.done=true;g.recovered=K;return true}
async function accept(text){let o;try{o=JSON.parse(text)}catch(e){return}if(o.t==='m'){let copy={t:o.t,v:o.v,f:o.f,name:o.name,size:o.size,type:o.type,block:o.block,k:o.k,r:o.r,groups:o.groups,frames:o.frames,sha:o.sha};if(crc32(new TextEncoder().encode(JSON.stringify(copy)))!==o.c)throw Error('文件信息校验失败');if(o.v!==2||o.k!==K||o.r!==R||o.block!==BLOCK||!Number.isInteger(o.groups)||o.groups<1)throw Error('不支持的 V2 参数');if(meta&&meta.f!==o.f){groups=[];frameCount=0}meta=o;groups=Array.from({length:meta.groups},newGroup);$('download').classList.add('hidden');setStatus(`已识别文件信息：${meta.name}，${fmt(meta.size)}。现在保持发送端自动播放。`);update();return}if(o.t!=='d'||!meta||o.f!==meta.f)return;if(!Number.isInteger(o.g)||o.g<0||o.g>=meta.groups||!Number.isInteger(o.i)||o.i<0||o.i>=K+R||o.b!==BLOCK||typeof o.d!=='string')return;let data;try{data=fromB64(o.d)}catch(e){return}if(data.length!==BLOCK||crc32(data)!==(o.c>>>0))return;let g=groups[o.g];if(o.i<K){if(g.data[o.i])return;g.data[o.i]=data;g.received++;}else{let pi=o.i-K;if(g.parity.has(pi))return;g.parity.set(pi,data);g.received++}frameCount++;if(!g.done){try{recoverGroup(g)}catch(e){console.warn('分组恢复失败',e)}}update();if(g.done)setStatus(`分组 ${o.g+1}/${meta.groups} 已恢复；总进度 ${groups.filter(x=>x.done).length}/${meta.groups}`)}
async function finish(){if(!meta||groups.some(g=>!g||!g.done)||finalBlob||finishing)return;finishing=true;let parts=[];for(let gi=0;gi<groups.length;gi++){for(let j=0;j<K;j++){let global=(gi*K+j)*BLOCK;if(global>=meta.size)break;let len=Math.min(BLOCK,meta.size-global);parts.push(groups[gi].data[j].subarray(0,len))}}finalBlob=new Blob(parts,{type:meta.type||'application/octet-stream'});if(meta.sha&&crypto.subtle){try{let h=await crypto.subtle.digest('SHA-256',await finalBlob.arrayBuffer()),actual=[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('');if(actual!==meta.sha){finalBlob=null;finishing=false;setStatus('文件 SHA-256 校验失败，请重新扫描。');return}}catch(e){console.warn('SHA-256校验不可用',e)}}if(blobUrl)URL.revokeObjectURL(blobUrl);blobUrl=URL.createObjectURL(finalBlob);$('download').classList.remove('hidden');setStatus('全部分组恢复完成，文件完整性校验通过。可以保存到 iPhone「文件」App。')}
$('start').onclick=start;$('stop').onclick=stop;$('reset').onclick=()=>{stop();meta=null;groups=[];frameCount=0;finalBlob=null;finishing=false;if(blobUrl)URL.revokeObjectURL(blobUrl);blobUrl=null;$('download').classList.add('hidden');$('groupsDone').textContent='0/0';$('blocksDone').textContent='0';$('frames').textContent='0';$('bar').style.width='0%';$('fileInfo').textContent='尚未收到文件信息';setStatus('接收记录已清空。')};$('download').onclick=async()=>{if(!finalBlob)return;let name=meta.name||'received_file';try{let f=new File([finalBlob],name,{type:meta.type||'application/octet-stream'});if(navigator.canShare&&navigator.canShare({files:[f]})&&navigator.share){await navigator.share({files:[f],title:name});return}}catch(e){if(e.name==='AbortError')return}let a=document.createElement('a');a.href=blobUrl;a.download=name;a.click()};
